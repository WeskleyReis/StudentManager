<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

    body {
      background-color: #0B0D10;
    }

    .card {
      width: fit-content;

      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    p {
      padding: 0;
      margin: 0;
    }

    .titulo {
      font-family: Cinzel;
      font-size: 24px;
      font-weight: 700;
      color: #E7E9EC;
    }

    .subtitulo {
      font-family: inter;
      color: #E7E9EC;
    }

    img {
      border-radius: 8px;
    }

    button {
      cursor: pointer;

      width: 100%;
      padding: 24px;

      background-color: #171C22;
      border: none;
      outline: none;
      border-radius: 12px;
    }

    button a {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;

      font-family: cinzel;
      font-size: 24px;
      font-weight: 700;
      color: #E7E9EC;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="titulo">
      Uma jornada além da vingança
    </p>
    <p class="subtitulo">
      Descrubra mais sobre a história de Kratos e sua joranda
    </p>
    <img src="god-of-war.jpg" alt="god-of-war.jpg">
    <button>
      <a href="https://youtu.be/2keP8VK7kDc?si=4PWR17x9xftT-wU4">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-play preview-icon"><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/><circle cx="12" cy="12" r="10"/></svg>
        ASSISTIR AO VIDEO 
      </a>
    </button>
  </div>
</body>
</html>
