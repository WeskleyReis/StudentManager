<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentManager</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <!-- MODAL DE ATUALIZAÇÃO -->
    <div class="update-overlay">
    
        <div class="update-modal">
    
            <!-- CABEÇALHO -->
            <div class="update-header">
    
                <h2>Atualizar dados do aluno</h2>
    
                <p>
                    Atualize todas as informações do aluno já cadastrado.
                </p>
    
            </div>
    
    
            <!-- FORMULÁRIO -->
            <form class="update-form">
    
                <!-- PRIMEIRA LINHA -->
                <div class="update-row">
    
                    <div class="update-field">
                        <label for="nome">Nome Completo *</label>
    
                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite o nome do aluno"
                            required
                        >
                    </div>
    
                    <div class="update-field">
                        <label for="matricula">Matrícula *</label>
    
                        <input
                            type="text"
                            id="matricula"
                            placeholder="Digite a matrícula do aluno"
                            inputmode="numeric"
                            pattern="[0-9]+"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            required
                        >
                    </div>
    
                </div>
    
    
                <!-- SEGUNDA LINHA -->
                <div class="update-row">
    
                    <div class="update-field">
                        <label for="email">Email *</label>
    
                        <input
                            type="email"
                            id="email"
                            placeholder="Digite o email do aluno"
                            required
                        >
                    </div>
    
                    <div class="update-field" type="number">
                        <label for="curso">Curso *</label>
    
                        <input
                            type="text"
                            id="curso"
                            placeholder="Ex.: Engenharia de Software"
                            required
                        >
                    </div>
    
                </div>
    
    
                <!-- TERCEIRA LINHA -->
                <div class="update-row update-row-final">
    
                    <div class="update-field">
                        <label for="nascimento">
                            Data de nascimento *
                        </label>
    
                        <input
                            type="date"
                            id="nascimento"
                            required
                        >
                    </div>
    
    
                    <div class="update-field" type="number">
                        <label for="telefone">Telefone</label>
    
                        <input
                            type="tel"
                            id="telefone"
                            placeholder="(00) 00000-0000"
                            inputmode="numeric"
                            pattern="[0-9]+"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    >
                    </div>
    
    
                    <div class="update-field">
                        <label for="periodo">Período</label>
    
                        <select id="periodo">
    
                            <option value="">Período</option>
                            <option>1º Semestre</option>
                            <option>2º Semestre</option>
                            <option>3º Semestre</option>
                            <option>4º Semestre</option>
                            <option>5º Semestre</option>
                            <option>6º Semestre</option>
                            <option>7º Semestre</option>
                            <option>8º Semestre</option>
    
                        </select>
                    </div>
    
    
                    <div class="update-field">
                        <label for="status">Status</label>
    
                        <select id="status">
    
                            <option value="">Status</option>
                            <option>Ativo</option>
                            <option>Trancado</option>
                            <option>Inativo</option>
    
                        </select>
                    </div>
    
                </div>
    
    
                <!-- BOTÕES -->
                <div class="update-buttons">
    
                    <button type="button" class="update-cancel">
                        Cancelar
                    </button>
    
                    <button type="submit" class="update-confirm">
                        Confirmar
                    </button>
    
                </div>
    
            </form>
    
        </div>
    
    </div>
    ```
</body>
</html>
